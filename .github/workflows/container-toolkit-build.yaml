name: NVIDIA Container Toolkit build
on:
  pull_request:
    paths:
      - "Pkgfile"
      - "base/**"
      - "nvidia-container-toolkit/**"
      - ".github/workflows/container-toolkit-build.yaml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "Pkgfile"
      - "base/**"
      - "nvidia-container-toolkit/**"
      - ".github/workflows/container-toolkit-build.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-extension:
    name: Build NVIDIA Container Toolkit 1.17.8 for Talos v1.13.10
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout libnvidia-container source
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/libnvidia-container
          ref: v1.17.8
          path: nvidia-container-toolkit/sources/libnvidia-container
      - name: Checkout NVIDIA Container Toolkit source
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/nvidia-container-toolkit
          ref: v1.17.8
          path: nvidia-container-toolkit/sources/nvidia-container-toolkit
      - name: Checkout NVIDIA nvidia-modprobe source
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/nvidia-modprobe
          ref: 550.54.14
          path: nvidia-container-toolkit/sources/nvidia-modprobe
      - name: Archive upstream source trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nvidia-container-toolkit/sources-archive
          git -C nvidia-container-toolkit/sources/libnvidia-container archive --format=tar HEAD | gzip -n > nvidia-container-toolkit/sources-archive/libnvidia-container-v1.17.8.tar.gz
          git -C nvidia-container-toolkit/sources/nvidia-container-toolkit archive --format=tar HEAD | gzip -n > nvidia-container-toolkit/sources-archive/nvidia-container-toolkit-v1.17.8.tar.gz
          git -C nvidia-container-toolkit/sources/nvidia-modprobe archive --format=tar HEAD | gzip -n > nvidia-container-toolkit/sources-archive/nvidia-modprobe-550.54.14.tar.gz
          rm -rf nvidia-container-toolkit/sources
          test -s nvidia-container-toolkit/sources-archive/libnvidia-container-v1.17.8.tar.gz
          test -s nvidia-container-toolkit/sources-archive/nvidia-container-toolkit-v1.17.8.tar.gz
          test -s nvidia-container-toolkit/sources-archive/nvidia-modprobe-550.54.14.tar.gz
      - uses: docker/setup-buildx-action@v3
      - name: Build toolkit system extension
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Pkgfile \
            --target nvidia-container-toolkit \
            --build-arg TALOS_VERSION=v1.13.10 \
            --output "type=oci,dest=$RUNNER_TEMP/nvidia-container-toolkit-1.17.8-talos-v1.13.10.oci.tar" \
            .
      - name: Upload toolkit extension OCI image
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-container-toolkit-1.17.8-talos-v1.13.10
          path: ${{ runner.temp }}/nvidia-container-toolkit-1.17.8-talos-v1.13.10.oci.tar
          if-no-files-found: error
          retention-days: 14
