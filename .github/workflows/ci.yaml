name: CI
on:
  pull_request:
  push:
    branches: [main, "feature/**"]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n scripts/validate-artifacts.sh
          bash -n scripts/extract-driver.sh
          sh -n nvidia-vgpu-guest/files/nvidia-gridd-wrapper.sh
      - name: Validate YAML
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 - <<'PY'
          import pathlib
          import yaml

          for path in (pathlib.Path("Pkgfile"), pathlib.Path("nvidia-vgpu-guest/pkg.yaml"), pathlib.Path("base/pkg.yaml")):
              text = path.read_text()
              if path.name == "Pkgfile":
                  text = "\n".join(text.splitlines()[1:])
              yaml.safe_load(text)
          toolkit_pkg = pathlib.Path("nvidia-container-toolkit/pkg.yaml").read_text()
          yaml.safe_load(toolkit_pkg)

          manifest = pathlib.Path("nvidia-vgpu-guest/manifest.yaml.tmpl").read_text()
          manifest = manifest.replace("{{ .BUILD_ARG_TALOS_VERSION }}", "v1.13.10")
          manifest = manifest.replace("{{ .BUILD_ARG_NVIDIA_DRIVER_VERSION }}", "535.161.07")
          yaml.safe_load(manifest)

          workflow = pathlib.Path(".github/workflows/driver-build.yaml").read_text()
          yaml.safe_load(workflow)
          toolkit_manifest = pathlib.Path("nvidia-container-toolkit/manifest.yaml.tmpl").read_text().replace("{{ .BUILD_ARG_TALOS_VERSION }}", "v1.13.10")
          yaml.safe_load(toolkit_manifest)
          service = pathlib.Path("nvidia-vgpu-guest/nvidia-gridd.yaml").read_text()
          yaml.safe_load(service)
          print("YAML syntax checks passed")
          PY
      - name: Validate Makefile targets
        run: make -n build KERNEL_IMAGE=example.invalid/kernel:tag >/dev/null
      - name: Validate required build inputs
        run: |
          test -s nvidia-vgpu-guest/files/nvidia.conf
          test -s nvidia-vgpu-guest/files/nvidia-gridd-wrapper.sh
          test -s nvidia-vgpu-guest/nvidia-gridd.yaml
          grep -q '^  - network:' nvidia-vgpu-guest/nvidia-gridd.yaml
          ! grep -q 'configuration: true' nvidia-vgpu-guest/nvidia-gridd.yaml
          grep -q 'nvidia-gridd' nvidia-vgpu-guest/pkg.yaml
          test -s Dockerfile.kernel-build
          test -x scripts/validate-artifacts.sh
          test -s scripts/extract-driver.sh
          grep -q 'BUILD_ARG_KERNEL_IMAGE' nvidia-vgpu-guest/pkg.yaml
          grep -q '/src/Module.symvers' nvidia-vgpu-guest/pkg.yaml
          grep -q 'install -m 0755 /bin/busybox' nvidia-vgpu-guest/pkg.yaml
          grep -q '/bin/busybox' nvidia-vgpu-guest/files/nvidia-gridd-wrapper.sh

      - name: Validate NVIDIA Container Toolkit extension inputs
        run: |
          test -s nvidia-container-toolkit/pkg.yaml
          test -s nvidia-container-toolkit/manifest.yaml.tmpl
          grep -q 'libnvidia-container' nvidia-container-toolkit/pkg.yaml
          grep -q 'nvidia-container-runtime' nvidia-container-toolkit/pkg.yaml
          grep -q 'nvidia-container-cli' nvidia-container-toolkit/pkg.yaml
          grep -q '10-nvidia-container-runtime.part' nvidia-container-toolkit/pkg.yaml
          ! grep -q 'nvidia-vgpu-guest' nvidia-container-toolkit/pkg.yaml
          grep -q 'LDCONFIG=true' nvidia-container-toolkit/pkg.yaml
