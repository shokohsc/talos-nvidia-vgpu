name: NVIDIA vGPU guest extension build
on:
  pull_request:
    paths:
      - "Pkgfile"
      - "Makefile"
      - "Dockerfile.kernel-build"
      - "Dockerfile.extensions-validator"
      - "nvidia-vgpu-guest/**"
      - "scripts/extract-driver.sh"
      - ".github/workflows/driver-build.yaml"
  push:
    branches: [main, "feature/**", "refactor/**"]
    paths:
      - "Pkgfile"
      - "Makefile"
      - "Dockerfile.kernel-build"
      - "Dockerfile.extensions-validator"
      - "nvidia-vgpu-guest/**"
      - "scripts/extract-driver.sh"
      - ".github/workflows/driver-build.yaml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-extension:
    name: GRID ${{ matrix.driver-version }} / Talos v1.13.10
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        driver-version: ["535.161.07", "535.309.01"]
    env:
      TALOS_VERSION: v1.13.10
      PKGS_REF: 9b044c593c71b0ea6deb9985b7907e008b91220c
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/chromium
          sudo docker system prune --all --force --volumes || true
          df -h
          df -i
      - name: Build Talos v1.13.10 extensions validator
        env:
          VALIDATOR_IMAGE: ghcr.io/shokohsc/talos-nvidia-vgpu-extensions-validator:v1.13.10-84cecb0
        run: |
          set -euo pipefail
          git clone https://github.com/siderolabs/extensions-validator.git "$RUNNER_TEMP/extensions-validator"
          git -C "$RUNNER_TEMP/extensions-validator" checkout 84cecb0
          cd "$RUNNER_TEMP/extensions-validator"
          go mod edit -require=github.com/siderolabs/talos/pkg/machinery@v1.13.10
          go mod tidy
          mkdir -p "$RUNNER_TEMP/validator-image"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-X github.com/siderolabs/talos/pkg/machinery/version.Tag=v1.13.10" \
            -o "$RUNNER_TEMP/validator-image/extensions-validator" ./cmd/extensions-validator
          mkdir -p "$RUNNER_TEMP/validator-smoke/rootfs"
          cat > "$RUNNER_TEMP/validator-smoke/manifest.yaml" <<'EOF'
          version: v1alpha1
          metadata:
            name: validator-smoke
            version: 1.0.0
            compatibility:
              talos:
                version: "= v1.13.10"
          EOF
          "$RUNNER_TEMP/validator-image/extensions-validator" validate --rootfs="$RUNNER_TEMP/validator-smoke" --pkg-name=validator-smoke
          cp "$GITHUB_WORKSPACE/Dockerfile.extensions-validator" "$RUNNER_TEMP/validator-image/Dockerfile"
          docker buildx build --platform linux/amd64 --tag "$VALIDATOR_IMAGE" --push "$RUNNER_TEMP/validator-image"
      - name: Extract GRID installer from versioned registry image
        env:
          NVIDIA_DRIVER_VERSION: ${{ matrix.driver-version }}
          NVIDIA_DRIVER_IMAGE: docker.io/shokohsc/nvidia-vgpu-driver:${{ matrix.driver-version }}-grid
          DRIVER_SOURCE_DIR: nvidia-vgpu-guest/driver
          WORKDIR: ${{ runner.temp }}/nvidia-vgpu-work
        run: |
          set -euo pipefail
          bash scripts/extract-driver.sh
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: Check or build exact Talos kernel tree
        run: |
          set -euo pipefail
          KERNEL_IMAGE="ghcr.io/shokohsc/talos-nvidia-vgpu-kernel-build:talos-${TALOS_VERSION}-${PKGS_REF}"
          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> "$GITHUB_ENV"
          if ! docker buildx imagetools inspect "$KERNEL_IMAGE" >/dev/null 2>&1; then
            git clone https://github.com/siderolabs/pkgs.git "$RUNNER_TEMP/pkgs"
            git -C "$RUNNER_TEMP/pkgs" checkout "$PKGS_REF"
            make -C "$RUNNER_TEMP/pkgs" target-kernel-build PLATFORM=linux/amd64 TARGET_ARGS="--tag=$KERNEL_IMAGE --push"
          fi
      - name: Validate kernel build image
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.kernel-validate" <<'EOF'
          ARG KERNEL_IMAGE
          FROM ${KERNEL_IMAGE} AS kernel
          FROM ghcr.io/siderolabs/tools:v1.13.0-12-gc70be08 AS validate
          COPY --from=kernel /src/Module.symvers /tmp/Module.symvers
          COPY --from=kernel /src/include/config/kernel.release /tmp/kernel.release
          RUN test -s /tmp/Module.symvers && test -s /tmp/kernel.release
          FROM scratch AS metadata
          COPY --from=validate /tmp/kernel.release /kernel-release.txt
          EOF
          docker buildx build --platform linux/amd64 --file "$RUNNER_TEMP/Dockerfile.kernel-validate" \
            --build-arg KERNEL_IMAGE="$KERNEL_IMAGE" --target metadata \
            --output "type=local,dest=$RUNNER_TEMP/kernel-metadata" "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/kernel-metadata/kernel-release.txt"
      - name: Build version-matched guest and GRIDD extension
        env:
          DRIVER_VERSION: ${{ matrix.driver-version }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --file Pkgfile --target nvidia-vgpu-guest \
            --build-arg TALOS_VERSION="$TALOS_VERSION" \
            --build-arg NVIDIA_DRIVER_VERSION="$DRIVER_VERSION" \
            --build-arg KERNEL_IMAGE="$KERNEL_IMAGE" \
            --output "type=oci,dest=$RUNNER_TEMP/nvidia-vgpu-$DRIVER_VERSION-talos-$TALOS_VERSION.oci.tar" \
            --output "type=docker,dest=$RUNNER_TEMP/nvidia-vgpu-$DRIVER_VERSION-talos-$TALOS_VERSION.docker.tar" .
      - name: Upload guest/GRIDD OCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-vgpu-guest-${{ matrix.driver-version }}-talos-v1.13.10
          path: ${{ runner.temp }}/nvidia-vgpu-${{ matrix.driver-version }}-talos-v1.13.10.oci.tar
          if-no-files-found: error
          retention-days: 14
      - name: Publish guest/GRIDD extension to GHCR
        env:
          DRIVER_VERSION: ${{ matrix.driver-version }}
          EXTENSION_TAR: ${{ runner.temp }}/nvidia-vgpu-${{ matrix.driver-version }}-talos-v1.13.10.docker.tar
          EXTENSION_IMAGE: ghcr.io/shokohsc/talos-nvidia-vgpu-extension
        run: |
          set -euo pipefail
          test -s "$EXTENSION_TAR"
          load_output="$(docker load --input "$EXTENSION_TAR")"
          printf '%s\n' "$load_output"
          loaded_image="$(printf '%s\n' "$load_output" | sed -n -e 's/^Loaded image: //p' -e 's/^Loaded image ID: //p' | tail -n 1)"
          test -n "$loaded_image"
          docker image inspect "$loaded_image" >/dev/null
          version_ref="$EXTENSION_IMAGE:$DRIVER_VERSION-talos-$TALOS_VERSION"
          commit_ref="$EXTENSION_IMAGE:$DRIVER_VERSION-$(git rev-parse --short=7 "$GITHUB_SHA")"
          docker tag "$loaded_image" "$commit_ref"
          docker push "$commit_ref"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$loaded_image" "$version_ref"
            docker push "$version_ref"
          else
            echo "Skipping moving version alias outside main: $version_ref"
          fi
          {
            echo "### Published GRID guest/GRIDD extension"
            echo "- Driver: $DRIVER_VERSION"
            echo "- Version reference: `$version_ref`"
            echo "- Commit reference: `$commit_ref`"
            echo "- Source: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
