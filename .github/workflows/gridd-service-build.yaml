name: NVIDIA GRIDD service CI
on:
  pull_request:
    paths:
      - "nvidia-vgpu-guest/pkg.yaml"
      - "nvidia-vgpu-guest/nvidia-gridd.yaml"
      - "nvidia-vgpu-guest/files/nvidia-gridd-wrapper.sh"
      - "nvidia-vgpu-guest/files/nvidia-dls-token-fetcher.go"
      - "nvidia-vgpu-guest/files/nvidia-dls-token-fetcher_test.go"
      - ".github/workflows/gridd-service-build.yaml"
  push:
    branches: [main, "feature/**", "refactor/**"]
    paths:
      - "nvidia-vgpu-guest/pkg.yaml"
      - "nvidia-vgpu-guest/nvidia-gridd.yaml"
      - "nvidia-vgpu-guest/files/nvidia-gridd-wrapper.sh"
      - "nvidia-vgpu-guest/files/nvidia-dls-token-fetcher.go"
      - "nvidia-vgpu-guest/files/nvidia-dls-token-fetcher_test.go"
      - ".github/workflows/gridd-service-build.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-gridd-service:
    name: Validate GRIDD payload and DLS token client
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
      - name: Test and compile static DLS token fetcher
        run: |
          set -euo pipefail
          cd nvidia-vgpu-guest/files
          go test ./nvidia-dls-token-fetcher.go ./nvidia-dls-token-fetcher_test.go
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/nvidia-dls-token-fetcher" nvidia-dls-token-fetcher.go
          file "$RUNNER_TEMP/nvidia-dls-token-fetcher"
      - name: Validate GRIDD wrapper and service manifest
        run: |
          set -euo pipefail
          sh -n nvidia-vgpu-guest/files/nvidia-gridd-wrapper.sh
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 - <<'PY'
          import pathlib
          import yaml
          yaml.safe_load(pathlib.Path("nvidia-vgpu-guest/nvidia-gridd.yaml").read_text())
          print("GRIDD service manifest YAML is valid")
          PY
          grep -Fq 'nvidia-gridd' nvidia-vgpu-guest/pkg.yaml
          grep -Fq 'nvidia-dls-token-fetcher' nvidia-vgpu-guest/pkg.yaml
          grep -Fq 'libFlxCore64.so' nvidia-vgpu-guest/pkg.yaml
          grep -Fq 'FeatureType=1' nvidia-vgpu-guest/pkg.yaml
          echo "GRIDD remains packaged inside the version-matched nvidia-vgpu-guest extension."
