name: nvidia-container-toolkit
variant: alpine
shell: /bin/bash
install:
  - bash
  - coreutils
  - grep
dependencies:
  # Keep the validator without merging the Talos tools rootfs over Alpine.
  - image: ghcr.io/shokohsc/talos-nvidia-vgpu-extensions-validator:v1.13.10-84cecb0
    from: /
    to: /
  # The toolkit is built against glibc because the proprietary GRID driver
  # libraries (NVML/CUDA) are glibc-linked. Keep this runtime private to the
  # extension under /usr/local; never replace Talos' musl libc.
  - image: ghcr.io/siderolabs/glibc:2.44
    from: /rootfs/usr/local
    to: /usr/local
steps:
  - prepare:
      - |
        set -euxo pipefail
        test -x /pkg/prebuilt/usr/local/bin/nvidia-container-runtime
        test -x /pkg/prebuilt/usr/local/bin/nvidia-container-runtime-hook
        test -x /pkg/prebuilt/usr/local/bin/nvidia-container-cli
        test -x /pkg/prebuilt/usr/local/bin/nvidia-ctk
        test -x /pkg/prebuilt/usr/local/bin/nvidia-cdi-hook
        test -s /pkg/prebuilt/usr/local/lib/libnvidia-container.so.1.18.2
        test -s /usr/local/lib/libc.so.6
        test -x /usr/local/lib/ld-linux-x86-64.so.2
    install:
      - |
        set -euxo pipefail
        mkdir -p /rootfs/usr/local/bin /rootfs/usr/local/lib \
          /rootfs/usr/local/share/licenses/nvidia-container-toolkit \
          /rootfs/etc/cri/conf.d \
          /rootfs/usr/local/etc/nvidia-container-runtime
        cp -a /pkg/prebuilt/usr/local/bin/. /rootfs/usr/local/bin/
        cp -a /pkg/prebuilt/usr/local/lib/. /rootfs/usr/local/lib/
        # Use the Talos-compatible glibc runtime supplied by siderolabs/glibc.
        # The Debian builder's glibc is intentionally not copied into the image;
        # this runtime is newer and remains isolated under /usr/local/lib.
        cp -a /usr/local/lib/. /rootfs/usr/local/lib/
        cp -a /pkg/prebuilt/usr/local/share/licenses/nvidia-container-toolkit/. \
          /rootfs/usr/local/share/licenses/nvidia-container-toolkit/
        cat > /rootfs/usr/local/etc/nvidia-container-runtime/config.toml <<'EOF'
        [nvidia-container-runtime]
          mode = "jit-cdi"
        EOF
        # Talos extensions cannot write arbitrary paths under /etc. Use a
        # wrapper to point the NVIDIA runtime at its supported XDG config path.
        cat > /rootfs/usr/local/bin/nvidia-container-runtime-wrapper <<'EOF'
        #!/bin/sh
        export XDG_CONFIG_HOME=/usr/local/etc
        exec /usr/local/bin/nvidia-container-runtime "$@"
        EOF
        chmod 0755 /rootfs/usr/local/bin/nvidia-container-runtime-wrapper
        cat > /rootfs/etc/cri/conf.d/10-nvidia-container-runtime.part <<'EOF'
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia]
          privileged_without_host_devices = false
          runtime_engine = ""
          runtime_root = ""
          runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia.options]
            BinaryName = "/usr/local/bin/nvidia-container-runtime-wrapper"
        EOF
    test:
      - |
        set -euxo pipefail
        for binary in nvidia-container-runtime nvidia-container-runtime-hook \
          nvidia-container-cli nvidia-ctk nvidia-cdi-hook; do
          test -x "/rootfs/usr/local/bin/${binary}"
          if grep -aFq 'libc.musl-x86_64.so.1' "/rootfs/usr/local/bin/${binary}"; then
            echo "${binary} is still linked to musl; expected a glibc build" >&2
            exit 1
          fi
        done
        test -s /rootfs/usr/local/lib/libnvidia-container.so.1.18.2
        test -L /rootfs/usr/local/lib/libnvidia-container.so.1
        test -L /rootfs/usr/local/lib/libnvidia-container-go.so.1
        test -x /rootfs/usr/local/lib/ld-linux-x86-64.so.2
        test -s /rootfs/usr/local/lib/libc.so.6
        # Exercise the actual packaged glibc loader and resolve all direct
        # dependencies before the extension is emitted.
        loader=/rootfs/usr/local/lib/ld-linux-x86-64.so.2
        runtime=/rootfs/usr/local/bin/nvidia-container-runtime
        # The runtime initializes its low-level OCI runtime even for --version.
        # Provide a harmless stub so this packaging test stays self-contained.
        runtime_stub_dir="$(mktemp -d)"
        trap 'rm -rf "${runtime_stub_dir}"' EXIT
        printf '%s\n' '#!/bin/sh' 'exit 0' > "${runtime_stub_dir}/runc"
        chmod +x "${runtime_stub_dir}/runc"
        export PATH="${runtime_stub_dir}:${PATH}"
        dependencies="$("${loader}" --library-path /rootfs/usr/local/lib --list "${runtime}" 2>&1)"
        printf '%s\n' "${dependencies}"
        if grep -Fq 'not found' <<< "${dependencies}"; then
          echo "Unresolved NVIDIA Container Toolkit runtime dependency" >&2
          exit 1
        fi
        # The runtime initializes its OCI-runtime backend even for --version.
        # Supply a harmless stub so this packaging test does not depend on a
        # host runc/docker-runc/crun binary being installed in the build image.
        runtime_stub_dir="$(mktemp -d)"
        trap 'rm -rf "${runtime_stub_dir}"' EXIT
        printf '%s\n' '#!/bin/sh' 'exit 0' > "${runtime_stub_dir}/runc"
        chmod 0755 "${runtime_stub_dir}/runc"
        PATH="${runtime_stub_dir}:${PATH}" "${loader}" --library-path /rootfs/usr/local/lib "${runtime}" --version
        grep -Fq 'BinaryName = "/usr/local/bin/nvidia-container-runtime-wrapper"' \
          /rootfs/etc/cri/conf.d/10-nvidia-container-runtime.part
        grep -Fq 'export XDG_CONFIG_HOME=/usr/local/etc' \
          /rootfs/usr/local/bin/nvidia-container-runtime-wrapper
        grep -Fq 'mode = "jit-cdi"' \
          /rootfs/usr/local/etc/nvidia-container-runtime/config.toml
        mkdir -p /extensions-validator-rootfs
        cp -a /rootfs /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
