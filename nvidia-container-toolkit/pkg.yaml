name: nvidia-container-toolkit
variant: alpine
shell: /bin/bash
install:
  - build-base
  - go
  - tar
  - bmake
  - rpcsvc-proto
  - libtirpc-dev
  - libcap-dev
  - libseccomp-dev
  - elfutils-dev
  - pkgconf
  - coreutils
  - curl
dependencies:
  # Keep the validator without merging the Talos tools rootfs over Alpine.
  - image: ghcr.io/shokohsc/talos-nvidia-vgpu-extensions-validator:v1.13.10-84cecb0
    from: /
    to: /
steps:
  - prepare:
      - |
        set -euxo pipefail
        # The runner archives upstream Git trees before bldr sees the package.
        # This prevents bldr from interpreting vendored Go *.tmpl fixtures as
        # Talos package templates.
        test -s /pkg/sources-archive/libnvidia-container-v1.17.8.tar.gz
        test -s /pkg/sources-archive/nvidia-container-toolkit-v1.17.8.tar.gz
        test -s /pkg/sources-archive/nvidia-modprobe-550.54.14.tar.gz
        mkdir -p /tmp/libnvidia-container /tmp/nvidia-container-toolkit /tmp/nvidia-modprobe
        tar -xzf /pkg/sources-archive/libnvidia-container-v1.17.8.tar.gz -C /tmp/libnvidia-container
        tar -xzf /pkg/sources-archive/nvidia-container-toolkit-v1.17.8.tar.gz -C /tmp/nvidia-container-toolkit
        tar -xzf /pkg/sources-archive/nvidia-modprobe-550.54.14.tar.gz -C /tmp/nvidia-modprobe
        # libnvidia-container's makefile downloads this pinned dependency itself.
        # Pre-populate its expected source directory and stamp to keep builds offline.
        mkdir -p /tmp/libnvidia-container/deps/src/nvidia-modprobe-1.17.8
        cp -a /tmp/nvidia-modprobe/modprobe-utils /tmp/libnvidia-container/deps/src/nvidia-modprobe-1.17.8/
        patch -d /tmp/libnvidia-container/deps/src/nvidia-modprobe-1.17.8 -p1 < /tmp/libnvidia-container/mk/nvidia-modprobe.patch
        touch /tmp/libnvidia-container/deps/src/nvidia-modprobe-1.17.8/.download_stamp
        test -f /tmp/libnvidia-container/Makefile
        test -f /tmp/nvidia-container-toolkit/Makefile
    build:
      - |
        set -euxo pipefail
        cd /tmp/libnvidia-container
        make -j"$(nproc)" MAJOR=1 MINOR=17 PATCH=8 VERSION=1.17.8 VERSION_STRING=1.17.8 REVISION=6eda4d76c8c5f8fc174e4abca83e513fb4dd63b0 WITH_NVCGO=yes WITH_LIBELF=yes WITH_TIRPC=no WITH_SECCOMP=yes CPPFLAGS="-I/usr/include/tirpc" LDLIBS="-ltirpc"
        make install LDCONFIG=true DESTDIR=/rootfs prefix=/usr/local exec_prefix=/usr/local bindir=/usr/local/bin libdir=/usr/local/lib includedir=/usr/local/include docdir=/usr/local/share/doc
        cd /tmp/nvidia-container-toolkit
        make cmds
    install:
      - |
        set -euxo pipefail
        mkdir -p /rootfs/usr/local/bin /rootfs/usr/local/lib /rootfs/usr/local/share/licenses/nvidia-container-toolkit /rootfs/etc/cri/conf.d
        find /tmp/nvidia-container-toolkit -maxdepth 1 -type f -executable -exec install -m 0755 {} /rootfs/usr/local/bin/ \;
        test -x /rootfs/usr/local/bin/nvidia-container-runtime
        test -x /rootfs/usr/local/bin/nvidia-container-runtime-hook
        test -x /rootfs/usr/local/bin/nvidia-ctk
        test -x /rootfs/usr/local/bin/nvidia-cdi-hook
        test -x /rootfs/usr/local/bin/nvidia-container-cli
        test -s /rootfs/usr/local/lib/libnvidia-container.so.1
        for runtime_library in libcap.so.2 libseccomp.so.2 libelf.so.1 libtirpc.so.3; do
          library_path="$(find /lib /usr/lib -name "${runtime_library}" -print -quit)"
          test -n "${library_path}"
          install -D -m 0755 "${library_path}" "/rootfs/usr/local/lib/${runtime_library}"
        done
        cp /tmp/libnvidia-container/LICENSE /rootfs/usr/local/share/licenses/nvidia-container-toolkit/
        cp /tmp/nvidia-container-toolkit/LICENSE /rootfs/usr/local/share/licenses/nvidia-container-toolkit/ 2>/dev/null || true
        cat > /rootfs/etc/cri/conf.d/10-nvidia-container-runtime.part <<'EOF'
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia]
          privileged_without_host_devices = false
          runtime_engine = ""
          runtime_root = ""
          runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia.options]
            BinaryName = "/usr/local/bin/nvidia-container-runtime"
        EOF
    test:
      - |
        set -euxo pipefail
        test -x /rootfs/usr/local/bin/nvidia-container-runtime
        test -x /rootfs/usr/local/bin/nvidia-container-runtime-hook
        test -x /rootfs/usr/local/bin/nvidia-ctk
        test -x /rootfs/usr/local/bin/nvidia-cdi-hook
        test -x /rootfs/usr/local/bin/nvidia-container-cli
        test -s /rootfs/usr/local/lib/libnvidia-container.so.1
        grep -Fq 'BinaryName = "/usr/local/bin/nvidia-container-runtime"' /rootfs/etc/cri/conf.d/10-nvidia-container-runtime.part
        mkdir -p /extensions-validator-rootfs
        cp -a /rootfs /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
