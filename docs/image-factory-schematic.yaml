# Image Factory schematic for the worker-vm-gpu Talos image.
# Apply at https://factory.talos.dev (paste this YAML to get a schematic ID,
# then use https://factory.talos.dev/image/<schematic-id>/v1.13.10/metal-amd64.iso)
# or with `talosctl image factory` / the factory API.
customization:
  extraKernelArgs:
    - net.ifnames=0
    - talos.config=http://tracer.home.arpa:8080/metadata?s=worker-vm-gpu
    - vlan=ens18.20:ens18
  systemExtensions:
    officialExtensions:
      - siderolabs/gvisor
      - siderolabs/nfs-utils
      - siderolabs/nfsd
      - siderolabs/qemu-guest-agent
      - siderolabs/stargz-snapshotter
      - siderolabs/uhid
      - siderolabs/uinput
