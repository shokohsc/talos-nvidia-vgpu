# Apply this machine-config patch only to Talos nodes that have:
#   - the NVIDIA vGPU guest driver loaded;
#   - NVIDIA Container Toolkit installed; and
#   - /usr/local/bin/nvidia-container-runtime available on the host.
#
# This registers the "nvidia" containerd handler used by the existing
# Kubernetes RuntimeClass (handler: nvidia). It deliberately does not change
# containerd's default runtime; ordinary pods continue to use runc.
machine:
  files:
    - op: create
      path: /etc/cri/conf.d/30-nvidia-runtime.part
      permissions: 0o600
      content: |
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia]
          runtime_type = "io.containerd.runc.v2"
          privileged_without_host_devices = false

          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.nvidia.options]
            BinaryName = "/usr/local/bin/nvidia-container-runtime"
