name: nvidia-vgpu-guest
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - image: "{{ .BUILD_ARG_KERNEL_IMAGE }}"
    from: /
    to: /
  - image: "{{ .LLVM_IMAGE }}:{{ .TOOLS_REV }}"
    from: /
    to: /
  # NVIDIA's extracted installer is glibc-linked, while the package build
  # stage is musl-based. Supply the same glibc runtime used by Talos.
  - image: ghcr.io/siderolabs/glibc:2.44
    from: /usr/local
    to: /usr/local
steps:
  - env:
      ARCH: x86_64
      LLVM: "1"
    prepare:
      - |
        test -s /src/Module.symvers
        test -s /src/include/config/kernel.release
        test -s /pkg/driver/kernel/Makefile
        test -x /pkg/driver/nvidia-installer

        # Preserve the installer-provided proprietary tree. Never copy
        # kernel-open headers into kernel/: the two module flavors have
        # different interfaces. Print the real header locations for diagnosis.
        echo "=== Proprietary kernel source headers ==="
        find /pkg/driver/kernel -type f \( \
          -name os-interface.h -o -name nv-firmware.h -o -name nv-dmabuf.h -o \
          -name nv-pci-types.h -o -name nv-linux.h -o -name nvtypes.h -o \
          -name conftest.h -o -name nv.h -o -name nvstatus.h \) -print | sort
        echo "=== Separate open-kernel source headers (reference only) ==="
        if [[ -d /pkg/driver/kernel-open ]]; then
          find /pkg/driver/kernel-open -type f \( \
            -name os-interface.h -o -name nv-firmware.h -o -name nv-dmabuf.h -o \
            -name nv-pci-types.h -o -name nv-linux.h -o -name nvtypes.h -o \
            -name conftest.h -o -name nv.h -o -name nvstatus.h \) -print | sort
        fi
        kernel_release="$(cat /src/include/config/kernel.release)"
        echo "Building NVIDIA GRID {{ .BUILD_ARG_NVIDIA_DRIVER_VERSION }} for Talos {{ .BUILD_ARG_TALOS_VERSION }}, kernel ${kernel_release}"
    build:
      - |
        cd /pkg/driver/kernel

        # Linux 6.13 changed the working directory used by external-module Kbuild.
        # GRID 535 defines cmd_symlink locally as "ln -sf $< $@", which leaves
        # a relative target. Backport NVIDIA's 550.142 fix: define the command
        # once in the parent Kbuild and resolve the input object to an absolute
        # path, removing the old per-module overrides.
        kbuild_file="/pkg/driver/kernel/Kbuild"
        test -s "$kbuild_file"
        grep -q '^NV_BUILD_TYPE ?= release$' "$kbuild_file"
        if ! grep -Fq 'cmd_symlink = ln -sf $(abspath $<) $@' "$kbuild_file"; then
          awk '
            { print }
            $0 == "NV_BUILD_TYPE ?= release" {
              print ""
              print "quiet_cmd_symlink = SYMLINK $@"
              print "cmd_symlink = ln -sf $(abspath $<) $@"
            }
          ' "$kbuild_file" > "${kbuild_file}.tmp"
          mv "${kbuild_file}.tmp" "$kbuild_file"
        fi
        for module_kbuild in \
          /pkg/driver/kernel/nvidia/nvidia.Kbuild \
          /pkg/driver/kernel/nvidia-modeset/nvidia-modeset.Kbuild; do
          test -s "$module_kbuild"
          sed -i \
            -e '/quiet_cmd_symlink = SYMLINK/d' \
            -e '/cmd_symlink = ln -sf/d' \
            "$module_kbuild"
        done
        grep -Fq 'cmd_symlink = ln -sf $(abspath $<) $@' "$kbuild_file"
        if grep -Fq 'cmd_symlink = ln -sf $< $@' \
          /pkg/driver/kernel/nvidia/nvidia.Kbuild \
          /pkg/driver/kernel/nvidia-modeset/nvidia-modeset.Kbuild; then
          echo "Legacy relative NVIDIA RM symlink command remains after patch" >&2
          exit 1
        fi
        echo "Patched GRID 535 RM symlink command for Linux 6.13+ Kbuild"

        # The proprietary module Kbuild expects the precompiled RM interface
        # objects (nv-kernel.o_binary and nv-modeset-kernel.o_binary). GRID
        # packages may place these shared binary objects in kernel-open even
        # when the proprietary source tree is selected for compilation.
        # Stage the matching-version objects into the proprietary tree before
        # Kbuild creates its nv-kernel.o symlink; do not substitute C sources.
        for binary in nvidia/nv-kernel.o_binary nvidia-modeset/nv-modeset-kernel.o_binary; do
          if [[ ! -s "$binary" ]]; then
            shared_binary="/pkg/driver/kernel-open/$binary"
            if [[ -s "$shared_binary" ]]; then
              install -m 0644 "$shared_binary" "$binary"
              echo "Staged shared NVIDIA RM object: $shared_binary -> /pkg/driver/kernel/$binary"
            else
              echo "Missing required NVIDIA RM object: $binary" >&2
              echo "Available matching objects in extracted GRID payload:" >&2
              find /pkg/driver -type f -name '*kernel.o_binary' -print >&2
              exit 1
            fi
          fi
        done

        # Linux removed follow_pfn() in 6.10. The replacement
        # follow_pfnmap_start()/end() is GPL-only, so a proprietary NVIDIA
        # module cannot call it without creating an unresolved GPL symbol.
        # Match NVIDIA's compatibility fallback: report unsupported PFN
        # lookup rather than calling the removed API or GPL-only follow_pte().
        mlock_source="/pkg/driver/kernel/nvidia/os-mlock.c"
        test -s "$mlock_source"
        if grep -q 'return follow_pfn(vma, address, pfn);' "$mlock_source"; then
          sed -i 's/return follow_pfn(vma, address, pfn);/return -1; \/\* follow_pfn() is unavailable on Linux 6.10+. *\//' "$mlock_source"
        fi
        if grep -q 'return follow_pfn(vma, address, pfn);' "$mlock_source"; then
          echo "Failed to patch removed follow_pfn() call in $mlock_source" >&2
          exit 1
        fi
        echo "Patched GRID 535 PFN lookup fallback for Linux 6.18"

        # NVIDIA's source tree has several mutually-referencing header roots
        # (common/inc, nvidia, and conftest output) from the proprietary tree.
        # Discover their actual locations from this extracted driver payload
        # instead of assuming a distro-specific include layout.
        include_flags=()
        while IFS= read -r include_dir; do
          include_flags+=("-I${include_dir}")
        done < <(find /pkg/driver/kernel -type f -name '*.h' -printf '%h\n' 2>/dev/null | sort -u)
        # Kbuild uses -nostdinc. Provide Clang's compiler builtin headers,
        # but deliberately exclude its stdint.h: that header conflicts with
        # Linux's int64_t/uint64_t typedefs in include/linux/types.h.
        clang_resource_dir="$(clang -print-resource-dir)"
        clang_resource_source="${clang_resource_dir}/include"
        clang_builtin_include="/tmp/clang-kernel-builtin-headers"
        test -s "${clang_resource_source}/stdarg.h"
        test -s "${clang_resource_source}/stddef.h"
        mkdir -p "${clang_builtin_include}"
        find "${clang_resource_source}" -maxdepth 1 -type f ! -name stdint.h \
          -exec cp -a {} "${clang_builtin_include}/" \;

        # NVIDIA 535's kernel-side nv-ioctl-numa.h includes <stdint.h>, but
        # Clang's userspace stdint.h redeclares int64_t/uint64_t already
        # provided by Linux. Supply the kernel's own fixed-width types instead.
        cat > "${clang_builtin_include}/stdint.h" <<'EOF'
        #include <linux/types.h>
        EOF

        # NVIDIA's proprietary nv.h places kernel RM types (nvidia_stack_t,
        # nv_state_t, nv_event_t, NV_GPU_NUM_BARS, etc.) behind #ifdef NVRM.
        # The vendor Makefile normally injects this define through its legacy
        # EXTRA_CFLAGS; pass it globally because this build uses modern Kbuild
        # and KCFLAGS for all translation units.
        # Keep string-valued defines in a header instead of passing quoted
        # values through Make/Kbuild, which strips the quotes from KCFLAGS.
        cat > /tmp/nvidia-build-defines.h <<'EOF'
        #define NV_VERSION_STRING "{{ .BUILD_ARG_NVIDIA_DRIVER_VERSION }}"
        EOF

        # GRID 535 still calls del_timer_sync(), which was renamed to
        # timer_delete_sync() in the Talos 6.18 kernel headers. Keep the
        # vendor sources unchanged and provide the legacy API spelling.
        test -s /src/include/linux/timer.h
        grep -q "timer_delete_sync" /src/include/linux/timer.h
        cat > /tmp/nvidia-timer-compat.h <<'EOF'
        #include <linux/timer.h>
        #define del_timer_sync(timer) timer_delete_sync(timer)
        EOF
        echo "Mapping legacy del_timer_sync() calls to Talos timer_delete_sync()"

        # Linux 6.15 moved VMA write-locking into __vma_start_write(), which
        # is GPL-only. The proprietary GRID 535 module cannot import it.
        # NVIDIA's mmap paths update flags on VMAs already write-locked by
        # the mmap path, so use vm_flags_reset() (which does not acquire the
        # lock) for these legacy vm_flags_set/clear call sites on 6.15+.
        cat > /tmp/nvidia-vma-flags-compat.h <<'EOF'
        #include <linux/mm.h>
        #include <linux/version.h>
        #if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 15, 0)
        #define vm_flags_set(vma, flags) vm_flags_reset((vma), (vma)->vm_flags | (flags))
        #define vm_flags_clear(vma, flags) vm_flags_reset((vma), (vma)->vm_flags & ~(flags))
        #endif
        EOF
        echo "Mapping proprietary NVIDIA VMA flag updates to vm_flags_reset() on Linux 6.15+"
        # The proprietary RM source gates the nvUvmInterface implementation behind
        # NV_UVM_ENABLE. NVIDIA's normal build system defines it for the core
        # module; because this build supplies KCFLAGS directly, preserve it here.
        extra_cflags="${include_flags[*]} -I/pkg/driver/kernel -I/pkg/driver/kernel/nvidia -I/pkg/driver/kernel/conftest -isystem ${clang_builtin_include} -DNVRM -DNV_UVM_ENABLE -include /tmp/nvidia-timer-compat.h -include /tmp/nvidia-vma-flags-compat.h -include /tmp/nvidia-build-defines.h"
        echo "Force-including NVIDIA timer compatibility header"

        echo "Using kernel-compatible stdint shim in ${clang_builtin_include}"
        echo "Passing NVRM and NV_VERSION_STRING={{ .BUILD_ARG_NVIDIA_DRIVER_VERSION }} through KCFLAGS"
        for header in nvtypes.h nv-linux.h nv.h; do
          header_path="$(find /pkg/driver/kernel -type f -name "$header" -print -quit)"
          if [[ -z "$header_path" ]]; then
            echo "Required NVIDIA header not present in extracted payload: $header" >&2
            exit 1
          fi
          echo "Found $header at $header_path"
        done

        echo "Adding ${#include_flags[@]} discovered NVIDIA header directories through KCFLAGS"
        # The GRID 535 DRM glue targets an older DRM API (fb_create signature,
        # output_poll_changed and drm_driver.date were removed/changed before
        # Linux 6.18). This guest package is headless: Proxmox owns the vGPU
        # device and the guest needs the core, UVM and modeset modules, not
        # the optional DRM/KMS integration. NVIDIA Kbuild supports excluding
        # individual modules through NV_EXCLUDE_KERNEL_MODULES.
        excluded_modules="nvidia-drm"
        echo "Excluding optional kernel module(s): ${excluded_modules}"
        if ! make CC=clang HOSTCC=clang LLVM=1 LD=ld.lld OBJDUMP=llvm-objdump KCFLAGS="${extra_cflags}" NV_EXCLUDE_KERNEL_MODULES="${excluded_modules}" -j "$(nproc)" SYSSRC=/src; then
          echo "=== NVIDIA module symbol diagnostics ===" >&2
          for object in nvidia.o nvidia/nv-interface.o nvidia-uvm.o; do
            if [[ -s "$object" ]]; then
              echo "--- global UVM interface symbols in $object ---" >&2
              llvm-nm -g "$object" 2>&1 | grep -E 'nvUvmInterface|__vma_start_write' || true
            else
              echo "Missing expected object: $object" >&2
            fi
          done
          echo "--- generated Module.symvers entries ---" >&2
          find /pkg/driver/kernel -name Module.symvers -type f -print -exec grep -H -E 'nvUvmInterface|__vma_start_write' {} \; 2>/dev/null || true
          echo "--- UVM interface declarations/exports in source ---" >&2
          grep -R -n -E 'EXPORT_SYMBOL.*nvUvmInterface|nvUvmInterfaceDupAddressSpace|nvUvmInterfaceMemoryAllocSys' /pkg/driver/kernel/nvidia /pkg/driver/kernel/nvidia-uvm 2>/dev/null | head -80 || true
          echo "=== End NVIDIA module symbol diagnostics ===" >&2
          exit 1
        fi
    install:
      - |
        kernel_release="$(cat /src/include/config/kernel.release)"
        module_dir="/rootfs/usr/lib/modules/${kernel_release}"
        mkdir -p "${module_dir}" /rootfs/usr/local/lib/modprobe.d /rootfs/usr/lib /rootfs/usr/bin
        cp /src/modules.order "${module_dir}/"
        cp /src/modules.builtin "${module_dir}/"
        cp /src/modules.builtin.modinfo "${module_dir}/"
        cd /pkg/driver/kernel
        make CC=clang HOSTCC=clang LLVM=1 LD=ld.lld OBJDUMP=llvm-objdump NV_EXCLUDE_KERNEL_MODULES=nvidia-drm -j "$(nproc)" modules_install \
          SYSSRC=/src INSTALL_MOD_PATH=/rootfs/usr INSTALL_MOD_DIR=extra INSTALL_MOD_STRIP=1

        # --extract-only intentionally exposes the kernel source tree, but
        # NVIDIA keeps the userspace utilities and libraries in installer
        # payload components. Run the vendor installer in userspace-only mode
        # and redirect its utility prefix into this extension's rootfs.
        # Kernel modules are built and installed separately above, against the
        # exact Talos kernel tree.
        test -x /usr/local/lib/ld-linux-x86-64.so.2 || {
          echo "Missing Talos glibc dynamic loader at /usr/local/lib/ld-linux-x86-64.so.2" >&2
          exit 1
        }
        /usr/local/lib/ld-linux-x86-64.so.2 \
          --library-path /usr/local/lib:/lib:/usr/lib \
          /pkg/driver/nvidia-installer \
          --silent \
          --no-questions \
          --no-kernel-modules \
          --no-kernel-module-source \
          --no-opengl-files \
          --no-wine-files \
          --no-dkms \
          --no-systemd \
          --no-distro-scripts \
          --no-x-check \
          --no-nouveau-check \
          --skip-module-load \
          --skip-depmod \
          --utility-prefix=/rootfs/usr \
          --utility-libdir=lib \
          --application-profile-path=/rootfs/usr/share/nvidia \
          --documentation-prefix=/rootfs/usr/share/doc

        # NVIDIA's installer may choose a versioned NVML filename; expose the
        # stable soname expected by applications and container runtimes.
        nvml_real="$(find /rootfs/usr/lib -type f -name 'libnvidia-ml.so.*' -print -quit)"
        test -n "$nvml_real" || {
          echo "NVIDIA installer did not install libnvidia-ml.so.* into /rootfs/usr/lib" >&2
          find /rootfs -iname '*nvidia-ml*' -o -name 'nvidia-smi' >&2
          exit 1
        }
        ln -sfn "$(basename "$nvml_real")" /rootfs/usr/lib/libnvidia-ml.so.1

        test -x /rootfs/usr/bin/nvidia-smi || {
          echo "NVIDIA installer did not install /rootfs/usr/bin/nvidia-smi" >&2
          find /rootfs -name nvidia-smi -print >&2
          exit 1
        }
        test -x /rootfs/usr/bin/nvidia-modprobe || {
          echo "NVIDIA installer did not install /rootfs/usr/bin/nvidia-modprobe" >&2
          find /rootfs -name nvidia-modprobe -print >&2
          exit 1
        }
        install -D -m 0644 /pkg/files/60-nvidia-vgpu.rules /rootfs/usr/lib/udev/rules.d/60-nvidia-vgpu.rules
        if [[ -d /pkg/driver/firmware ]]; then
          mkdir -p /rootfs/usr/lib/firmware/nvidia
          cp -a /pkg/driver/firmware/. /rootfs/usr/lib/firmware/nvidia/
        fi
        cp /pkg/files/nvidia.conf /rootfs/usr/local/lib/modprobe.d/nvidia.conf
    test:
      - |
        kernel_release="$(cat /src/include/config/kernel.release)"
        module_dir="/rootfs/usr/lib/modules/${kernel_release}"
        for module in nvidia nvidia-modeset nvidia-uvm; do
          find "${module_dir}" -type f -name "${module}.ko" -print -quit | grep -q . || {
            echo "Missing ${module}.ko in ${module_dir}" >&2
            exit 1
          }
        done
        test -e /rootfs/usr/lib/libnvidia-ml.so.1 || {
          echo "Missing usable NVML soname /usr/lib/libnvidia-ml.so.1" >&2
          find /rootfs/usr/lib -name 'libnvidia-ml.so*' -ls >&2
          exit 1
        }
        test -x /rootfs/usr/bin/nvidia-smi || {
          echo "Missing /usr/bin/nvidia-smi" >&2
          exit 1
        }
        test -x /rootfs/usr/bin/nvidia-modprobe
        test -s /rootfs/usr/lib/udev/rules.d/60-nvidia-vgpu.rules
        grep -Fq 'ACTION=="add|bind"' /rootfs/usr/lib/udev/rules.d/60-nvidia-vgpu.rules
        grep -Fq 'RUN+="/usr/bin/nvidia-modprobe -c 255 -c 0"' /rootfs/usr/lib/udev/rules.d/60-nvidia-vgpu.rules
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /