name: nvidia-vgpu-guest
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - image: "{{ .BUILD_ARG_ARTIFACT_IMAGE }}"
    from: /artifacts
    to: /artifacts
steps:
  - install:
      - |
        test -n "{{ .BUILD_ARG_TALOS_VERSION }}"
        test -n "{{ .BUILD_ARG_KERNEL_RELEASE }}"
        test -d /artifacts/rootfs/usr/lib/modules/{{ .BUILD_ARG_KERNEL_RELEASE }}
        mkdir -p /rootfs
        cp -a /artifacts/rootfs/. /rootfs/
        mkdir -p /rootfs/usr/local/lib/modprobe.d
        cp /pkg/files/nvidia.conf /rootfs/usr/local/lib/modprobe.d/nvidia.conf
    test:
      - |
        module_root="/rootfs/usr/lib/modules/{{ .BUILD_ARG_KERNEL_RELEASE }}"
        find "$module_root" -type f \( -name 'nvidia.ko' -o -name 'nvidia.ko.xz' -o -name 'nvidia.ko.zst' \) -print -quit | grep -q .
        find "$module_root" -type f \( -name 'nvidia-uvm.ko' -o -name 'nvidia-uvm.ko.xz' -o -name 'nvidia-uvm.ko.zst' -o -name 'nvidia_uvm.ko' -o -name 'nvidia_uvm.ko.xz' -o -name 'nvidia_uvm.ko.zst' \) -print -quit | grep -q .
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /